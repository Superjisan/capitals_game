<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitals Game</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body>
    <h1>Capitals Game</h1>
    <p>Welcome to the Capitals Game! Test your knowledge of world capitals.</p>
    <!-- The game interface will be implemented here -->
    <!-- First start out with one country and ask the user for the capital -->
    <!-- div of buttons  -->
    <div id="continent-buttons">
        <button class="continent-btn" id="africa">Africa</button>
        <button class="continent-btn" id="asia">Asia</button>
        <button class="continent-btn" id="europe">Europe</button>
        <button class="continent-btn" id="north-america">North America</button>
        <button class="continent-btn" id="south-america">South America</button>
        <button class="continent-btn" id="oceania">Oceania</button>
        <button class="continent-btn active" id="world">World</button>
    </div>
    <div id="game-container">
        <p id="country"></p>
        <input list="capitals-list" type="text" id="answer" placeholder="Enter the capital">
        <datalist id="capitals-list">
            <!-- Options will be populated dynamically -->
        </datalist>
        <button id="submit">Submit</button>
        <p id="feedback">

        </p>
        <p id="score">
            Score: <span id="score-value">0</span>
        </p>
        <p id="progress">
            Progress: <span id="progress-value">0</span> / <span id="total-countries">0</span>
        </p>

        <!-- Table containing all answers -->
        <table id="answers-table">
            <thead>
                <tr>
                    <th>Country</th>
                    <th>Capital</th>
                    <th>Result</th>
                    <th>Your Answer</th>
                </tr>
            </thead>
            <tbody id="answers-body">

            </tbody>
        </table>
    </div>
    <script type="module" src="./capitals_game.js"></script>
</body>

</html>
