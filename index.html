<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitals Game</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Capitals Game</h1>
    <p>Welcome to the Capitals Game! Test your knowledge of world capitals.</p>
    <!-- The game interface will be implemented here -->
    <!-- First start out with one country and ask the user for the capital -->
    <div id="game-container">
        <p id="country"></p>
        <input type="text" id="answer" placeholder="Enter the capital">
        <button id="submit">Submit</button>
        <p id="feedback">
            
        </p>
        <p id="score">
            Score: <span id="score-value">0</span>
        </p>
        <p id="progress">
            Progress: <span id="progress-value">0</span> / <span id="total-countries">0</span>
        </p>

        <!-- Table containing all answers -->
        <table id="answers-table">
            <thead>
                <tr>
                    <th>Country</th>
                    <th>Capital</th>
                    <th>Result</th>
                    <th>Your Answer</th>
                </tr>
            </thead>
            <tbody id="answers-body">
                
            </tbody>
        </table>
    </div>
    <script type="module" src="./capitals_game.js"></script>
</body>
</html>
